[package]
name = "shifou-xinfer"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
shifou = { path = "../..", features = ["peer"] }
xinfer = { git = "https://github.com/moriyoshi/xinfer.git", rev = "17499e450a174e25be333f88c654ff6743fd4465", features = ["cuda"] }
candle-core = { git = "https://github.com/guoqingbao/candle.git", rev = "23a6f38", features = ["cuda"] }
attention-rs = { git = "https://github.com/guoqingbao/attention.rs.git", rev = "c0f19f2", features = ["cuda"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = "0.21.2"
anyhow = "1"
half = "2"
rayon = "1"

yesno-core = { path = "../../../yesno/yesno-core" }
yesno-plugin = { path = "../../../yesno/yesno-plugin" }
